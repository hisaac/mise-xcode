---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-test-ubuntu:
    name: Integration Test (Ubuntu - Should Fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Test plugin on Ubuntu (expect failure)
        run: |
          set +e  # Don't exit on error
          mise plugin link --force xcode-version .
          mise use xcode-version@16.4 2>&1 | tee output.txt

          # Check if it failed with the expected error message
          if grep -q "Xcode is only available for macOS" output.txt; then
            echo "✓ Plugin correctly failed on Ubuntu with expected error"
            exit 0
          else
            echo "✗ Plugin did not fail as expected on Ubuntu"
            cat output.txt
            exit 1
          fi

  integration-test-windows:
    name: Integration Test (Windows - Should Fail)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Test plugin on Windows (expect failure)
        shell: bash
        run: |
          set +e  # Don't exit on error
          mise plugin link --force xcode-version .
          mise use xcode-version@16.4 2>&1 | tee output.txt

          # Check if it failed with the expected error message
          if grep -q "Xcode is only available for macOS" output.txt; then
            echo "✓ Plugin correctly failed on Windows with expected error"
            exit 0
          else
            echo "✗ Plugin did not fail as expected on Windows"
            cat output.txt
            exit 1
          fi

  integration-test-macos:
    name: Integration Test (macOS - Should Work)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Test plugin on macOS
        run: |
          mise plugin link --force xcode-version .

          # Try to activate the plugin with a version
          # This will attempt to find an installed Xcode
          # It might not find the exact version, but should not error about macOS
          set +e
          mise use xcode-version@16.4 2>&1 | tee output.txt
          exit_code=$?

          # Check that we didn't get the "macOS only" error
          if grep -q "Xcode is only available for macOS" output.txt; then
            echo "✗ Plugin incorrectly failed on macOS"
            exit 1
          fi

          # The plugin should work on macOS (even if no matching Xcode is found)
          echo "✓ Plugin ran on macOS without OS-level errors"
          echo "Exit code: $exit_code"
          cat output.txt
