---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run ci

  integration-test-ubuntu:
    name: Integration Test (Ubuntu - Should Fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Test plugin on Ubuntu (expect failure)
        run: |
          set +e  # Don't exit on error
          mise run _bootstrap_test_env

          # Check if it failed with the expected error message
          if grep -q "Xcode is only available for macOS" output.txt; then
            echo "✓ Plugin correctly failed on Ubuntu with expected error"
            exit 0
          else
            echo "✗ Plugin did not fail as expected on Ubuntu"
            cat output.txt
            exit 1
          fi

  integration-test-windows:
    name: Integration Test (Windows - Should Fail)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Test plugin on Windows (expect failure)
        shell: bash
        run: |
          set +e  # Don't exit on error
          mise run _bootstrap_test_env

          # Check if it failed with the expected error message
          if grep -q "Xcode is only available for macOS" output.txt; then
            echo "✓ Plugin correctly failed on Ubuntu with expected error"
            exit 0
          else
            echo "✗ Plugin did not fail as expected on Ubuntu"
            cat output.txt
            exit 1
          fi

  integration-test-macos:
    name: Integration Test (macOS - Should Work)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Test plugin on macOS
        run: mise run _bootstrap_test_env
