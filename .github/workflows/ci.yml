---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        runs-on: [macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: |
          mise run lint
          mise run test

  final:
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |-
            const results = {
              'test': '${{ needs.test.result }}',
            };

            let allPassed = true;
            let failingJobs = [];

            for (const jobName in results) {
              if (results[jobName] !== 'success') {
                allPassed = false;
                failingJobs.push(jobName);
              }
            }

            if (!allPassed) {
              core.setFailed(`The following jobs failed or were skipped: ${failingJobs.join(', ')}`);
            } else {
              console.log('All CI jobs completed successfully');
            }
