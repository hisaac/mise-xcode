---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run ci

  integration-test-ubuntu:
    name: Integration Test (Ubuntu - Should Fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Test plugin on Ubuntu (expect failure)
        run: |
          set +e  # Don't exit on error
          mise run _bootstrap_test_env

          # Check if it failed with the expected error message
          if grep -q "Xcode is only available for macOS" output.txt; then
            echo "✓ Plugin correctly failed on Ubuntu with expected error"
            exit 0
          else
            echo "✗ Plugin did not fail as expected on Ubuntu"
            cat output.txt
            exit 1
          fi

  integration-test-windows:
    name: Integration Test (Windows - Should Fail)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Test plugin on Windows (expect failure)
        shell: bash
        run: |
          set +e  # Don't exit on error
          mise run _bootstrap_test_env

          # Check if it failed with the expected error message
          if grep -q "Xcode is only available for macOS" output.txt; then
            echo "✓ Plugin correctly failed on Ubuntu with expected error"
            exit 0
          else
            echo "✗ Plugin did not fail as expected on Ubuntu"
            cat output.txt
            exit 1
          fi

  integration-test-macos:
    name: Integration Test (macOS - Should Work)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Test plugin on macOS
        run: mise run _bootstrap_test_env

  final:
    needs:
      - unit-test
      - integration-test-macos
      - integration-test-ubuntu
      - integration-test-windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const results = {
              'unit-test': '${{ needs.unit-test.result }}',
              'integration-test-ubuntu': '${{ needs.integration-test-ubuntu.result }}',
              'integration-test-macos': '${{ needs.integration-test-macos.result }}',
              'integration-test-windows': '${{ needs.integration-test-windows.result }}',
            };

            let allPassed = true;
            let failingJobs = [];

            for (const jobName in results) {
              if (results[jobName] !== 'success') {
                allPassed = false;
                failingJobs.push(jobName);
              }
            }

            if (!allPassed) {
              core.setFailed(`The following jobs failed or were skipped: ${failingJobs.join(', ')}`);
            } else {
              console.log('All CI jobs completed successfully');
            }
