---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MISE_ENV: ci

jobs:
  test-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: false
          cache-save: true
      - run: mise run test-unit
      - run: mise run test-integration

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: false
          cache-save: true
      - run: mise run test-integration
