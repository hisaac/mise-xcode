[settings]
activate_aggressive = true
experimental = true

[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"

[tools.lua]
version = "5.4"
os = "linux | macos"

[hooks]
postinstall = "mise run bootstrap"

[tasks.bootstrap]
run = [{ task = "_bootstrap_hk" }, { task = "_bootstrap_luarocks" }]

[tasks.lint]
description = "Lint all code using hk"
run = "hk check --all"

[tasks.format]
alias = ["fix", "fmt"]
description = "Format all code using hk"
run = "hk fix --all"

[tasks.test]
depends = ["_bootstrap_test_env"]
description = "Run unit tests"
run = "scripts/test.bash"

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test"]

# Hidden tasks

[tasks._bootstrap_hk]
hide = true
run = "hk install --mise"

[tasks._bootstrap_luarocks]
hide = true
run = "luarocks install --only-deps mise-xcode-dev-1.rockspec"

[tasks._bootstrap_test_env]
hide = true
run = "mise plugin link --force xcode-version ."
