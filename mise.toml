[settings]
activate_aggressive = true
experimental = true

[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
lua = "5.4"
pkl = "latest"
stylua = "latest"
xcodes = "latest"

[hooks]
postinstall = "mise run bootstrap"

[tasks.bootstrap]
run = ["hk install --mise", "mise run install_dependencies"]

[tasks.install_dependencies]
hide = true
quiet = true
run = '''
if ! luarocks show "luacheck" >/dev/null 2>&1; then
	luarocks install luacheck
fi
echo "All dependencies installed"
'''

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test"]
