[settings]
activate_aggressive = true
experimental = true

[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
lua = "5.4"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"

[hooks]
postinstall = "mise run bootstrap"

[tasks.bootstrap]
depends = ["_bootstrap_hk", "_bootstrap_luarocks"]

[tasks.lint]
alias = "check"
description = "Lint all code using hk"
run = "hk check --all"

[tasks.format]
alias = ["fix", "fmt"]
description = "Format all code using hk"
run = "hk fix --all"

[tasks.test]
depends = ["unit-test", "integration-test"]

[tasks.unit-test]
run = "scripts/unit-test.bash"

[tasks.integration-test]
run = "scripts/integration-test.bash"

# Hidden tasks

[tasks._bootstrap_hk]
hide = true
run = "hk install --mise"

[tasks._bootstrap_luarocks]
hide = true
run = "luarocks install --only-deps mise-xcode-dev-1.rockspec"
