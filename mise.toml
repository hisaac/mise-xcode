[settings]
activate_aggressive = true
experimental = true

[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
lua = "5.4"
pkl = "latest"
stylua = "latest"

[hooks]
postinstall = "mise run bootstrap"

[tasks.bootstrap]
run = [{ task = "_bootstrap_hk" }, { task = "_bootstrap_luarocks" }]

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.test]
description = "Run unit tests"
run = [
	"mise plugin link --force xcode-version .",
	"mise env",
	"scripts/test.bash",
]

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test"]

# Hidden tasks

[tasks._bootstrap_hk]
hide = true
run = "hk install --mise"

[tasks._bootstrap_luarocks]
hide = true
run = "luarocks install --only-deps mise-xcode-dev-1.rockspec"
