[settings]
experimental = true

[tools]
actionlint = "latest"
hk = "latest"
jq = "latest"
"vfox:hisaac/vfox-lua" = "5.4"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
yamlfmt = "latest"

[hooks]
postinstall = "mise run bootstrap"

[tasks.bootstrap]
depends = ["_bootstrap_hk", "_bootstrap_luarocks"]

[tasks.check]
alias = ["chk", "lint"]
run = "hk check --all"

[tasks.fix]
alias = ["fmt", "format"]
run = "hk fix --all"

[tasks.test]
run = [{ task = "test-unit" }, { task = "test-integration" }]

[tasks.test-unit]
run = "lua tests/run_unit_tests.lua --verbose"

[tasks.test-integration]
run = "lua tests/run_integration_tests.lua --verbose"

# Hidden tasks

[tasks._bootstrap_hk]
hide = true
run = "hk install --mise"

[tasks._bootstrap_luarocks]
hide = true
run = [
  "luarocks install dkjson",
  "luarocks install luacheck",
  "luarocks install luaunit",
]
